<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Deadliner – Monthly Calendar</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700,italic" rel="stylesheet"/>
  <style>
    :root{ --ink:#171F39; --muted:#9B9A9A; --bg:#E5E7E9; --side:#1E2A38; --panel:#fff; --rule:#ECE9E7; --accent:#0A88B4; --ok:#2ecc71; --danger:#e05a5a; --shadow:0 8px 24px rgba(0,0,0,.08); }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:'Open Sans',Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .app{display:grid;grid-template-columns:201px 1fr;grid-template-rows:80px 1fr;grid-template-areas:"side head" "side main";min-height:100vh}
    /* side */
    .side{grid-area:side;background:var(--side);color:#fff}
    .brand{display:flex;gap:10px;align-items:center;margin:24px 0 28px 24px}
    .brand .logo{width:30px;height:30px;border-radius:6px;}
    .brand .name{font-weight:700;font-style:italic;font-size:24px}
    .nav{display:flex;flex-direction:column;gap:22px;margin:10px 0 0 48px}
    .nav a{color:#fff;text-decoration:none;opacity:.9;font-size:16px}
    .nav a.active{opacity:1;font-weight:700}
    /* head */
    .head{grid-area:head;display:flex;align-items:center;padding:0 28px}
    .title{font-size:40px;font-weight:800;font-style:italic;margin-left:-900px}
    .sp{flex:1}
    .btn{border:1;border-radius:10px;padding:10px 14px;font-weight:700;background: transparent;color:var(--accent);cursor:pointer}
    #loginResult{margin-left:8px;color:#ffffff;font-size:12px}
    /* main layout */
    .main{grid-area:main;display:grid;grid-template-columns:1fr 420px;gap:28px;padding:24px 28px 40px 28px}
    /* calendar card */
    .cal-wrap{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px;max-width:840px;margin-left:24px}
    .cal-hd{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
    .cal-hd h2{margin:0;font-size:22px;font-weight:800;color:#5a6377}
    .nav-arw{width:32px;height:32px;border:0;border-radius:8px;background:#F2F4F7;cursor:pointer}
    .cal-grid{margin-top:14px;border-radius:14px;padding:10px}
    .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;color:#94a0b4;font-weight:700;font-size:14px;text-align:center;margin-bottom:6px}
    .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .d{height:72px;border-radius:14px;background:#fff;box-shadow:0 1px 0 #eee;display:flex;align-items:center;justify-content:center;position:relative}
    .d.muted{color:#c8ced9}
    .d .num{position:absolute;top:8px;left:10px;font-weight:700}
    .d.dot::after{content:'';position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#9bb8ff}
    .d.today{
  position:relative; background:#fff;
  box-shadow: inset 0 0 0 2px rgba(10,136,180,.35);
}
.d.today .num{ color:#0A88B4; }
    .d.deadline::after{background:#ff7b7b}
    /* right rail */
    .rail{padding-right:8px}
    .rail h3{font-size:28px;font-weight:800;margin:10px 6px 12px 6px}
    .card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin:10px 6px}
    .p-ttl{font-weight:800;margin-bottom:6px}
    .meta{font-size:12px;color:#8a919f;margin-bottom:8px}
    .bar{height:10px;background:#eef1f4;border-radius:99px;overflow:hidden}
    .bar i{display:block;height:100%;background:#1aa3d9;width:40%}
    .days-left{float:right;color:#6e778a;font-size:12px;margin-top:-30px}
    .new-rail{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px;margin:12px 6px;text-align:center;color:#8b8f9c}
    .cta{display:block;background:#e9f7ff;color:#0A88B4;border:0;border-radius:999px;padding:16px 18px;font-weight:800;width:100%;margin:16px 6px 0 6px;cursor:pointer}
    .cta.peach{background:#fff3e9;color:#9f6b3d}
    .muted{color:#8b8f9c}
    /* toast */
    .toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transform:translateY(6px);transition:.25s}
    .toast.show{opacity:1;transform:none}
    /* auth modals */
    .modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.18);align-items:center;justify-content:center;display:none}
    .panel{background:#fff;padding:32px 32px 24px 32px;border-radius:16px;max-width:380px;width:96vw;box-shadow:0 4px 24px rgba(0,0,0,0.12);position:relative;display:flex;flex-direction:column;gap:18px;}
    .panel h3{margin:0;text-align:center;font-size:22px;font-weight:700}
    .panel .x{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;}
    .panel form{display:flex;flex-direction:column;gap:12px;}
    .panel input{width:100%;padding:12px;border-radius:8px;border:1px solid #eee;font-size:16px;}
    .panel .submit{width:100%;background:#232B44;color:#fff;border-radius:8px;border:none;padding:12px 0;font-size:16px;font-weight:700;cursor:pointer;}
    .panel .link{color:#232B44;text-decoration:underline;text-align:center}
    .hint{font-size:14px;color:#888;text-align:center}
  </style>
</head>

<script>
/* ========= OAuth 시작 URL (EC2 도메인으로 통일) ========= */
const OAUTH_BASE = "https://api.rightmarks.site";

/* ========= 엔드포인트/공통 ========= */
const API_BASE = 'https://api.rightmarks.site';
const ENDPOINTS = {
  calendarEvents: '/api/calendar/events',
  deadlines: '/api/deadlines',
  signup: '/api/users/register',
  login: '/api/users/login',
  me: '/api/users/me',
  logout: '/api/users/logout',
};

/* ========= 토큰 저장/헤더 유틸 (access_token 키로 고정) ========= */
function getRawToken() {
  return localStorage.getItem('accessToken') || '';
}
function authHeader() {
  const t = getRawToken();
  return t ? { Authorization: `Bearer ${t}` } : {};
}

/* ========= Fetch 래퍼 ========= */
async function jfetch(path, opt = {}) {
  const url = new URL(API_BASE + path);
  const { method = 'GET', headers = {}, params, body } = opt;
  if (params) Object.entries(params).forEach(([k, v]) => v != null && url.searchParams.append(k, v));
  const res = await fetch(url, {
    method,
    headers: {
      accept: 'application/json;charset=UTF-8',
      ...(body ? { 'Content-Type': 'application/json;charset=UTF-8' } : {}),
      ...authHeader(),
      ...headers,
    },
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'omit',
  });
  const text = await res.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch { data = text; }
  if (!res.ok || (data && typeof data === 'object' && data.isSuccess === false)) {
    const msg = data?.message || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return data?.result ?? data;
}

/* ========= Toast ========= */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* ========= OAuth2 콜백 해시 프래그먼트 처리 ========= */
function parseHashFragment(hash) {
  const q = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : hash);
  const obj = {};
  q.forEach((v, k) => (obj[k] = v));
  return obj;
}

async function handleOAuthCallback() {
  // token(우선) / access_token(fallback) 키 모두 대응
  if (!location.hash.includes('token=') && !location.hash.includes('accessToken=')) return;

  const params = parseHashFragment(location.hash);
  const raw = params.token || params.accessToken;
  if (!raw) {
    location.replace('/deadLiner-dashBoard.html?error=missing_token');
    return;
  }

  // 1) 저장 (access_token 키로 고정)
  localStorage.setItem('accessToken', raw);

  // 2) 유저 정보 저장
  try {
    const res = await fetch(API_BASE + ENDPOINTS.me, {
      headers: { ...authHeader(), accept: 'application/json;charset=UTF-8' },
      credentials: 'omit',
    });
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('me', JSON.stringify(data?.result ?? data));
      window.history.replaceState({}, '', '/deadLiner-dashBoard.html');
      location.replace('/deadLiner-dashBoard.html');
    } else {
      window.history.replaceState({}, '', '/deadLiner-dashBoard.html');
      location.replace('/deadLiner-dashBoard.html?error=invalid_token');
    }
  } catch {
    window.history.replaceState({}, '', '/deadLiner-dashBoard.html');
    location.replace('/deadLiner-dashBoard.html?error=invalid_token');
  }
}
handleOAuthCallback();

/* ========= Auth UI wiring ========= */
const loginBtn = document.getElementById('loginBtn');
const loginBtnText = document.getElementById('loginBtnText');

const loginModal   = document.getElementById('loginModal');
const loginClose   = document.getElementById('loginModalClose');
const loginForm    = document.getElementById('loginForm');
const loginEmail   = document.getElementById('loginEmail');
const loginPw      = document.getElementById('loginPassword');
const loginSignup  = document.getElementById('loginSignup');

const signupModal  = document.getElementById('signupModal');
const signupClose  = document.getElementById('signupModalClose');
const signupForm   = document.getElementById('signupForm');
const signupName   = document.getElementById('signupName');
const signupEmail  = document.getElementById('signupEmail');
const signupPw     = document.getElementById('signupPassword');
const signupPw2    = document.getElementById('signupPassword2');
const signupToLogin= document.getElementById('signupToLogin');

function open(el){ el.style.display='flex'; }
function close(el){ el.style.display='none'; }

loginBtn.onclick = () => {
  // 이미 로그인 상태라면 로그아웃 확인
  if (loginBtnText.textContent.endsWith('님')) {
    showLogoutConfirm();
  } else {
    open(loginModal);
  }
};
loginClose.onclick = () => close(loginModal);
signupClose.onclick = () => close(signupModal);

// 로그인 모달 → 회원가입 모달
loginSignup.onclick = (e)=>{ e.preventDefault(); close(loginModal); open(signupModal); };
// 회원가입 모달 → 로그인 모달
signupToLogin.onclick = (e)=>{ e.preventDefault(); close(signupModal); open(loginModal); };

/* ====== 소셜 로그인 버튼: EC2 도메인으로 시작 ====== */
const kakaoBtn  = document.getElementById('loginKakao');
const googleBtn = document.getElementById('loginGoogle');
const redirect = encodeURIComponent(window.location.origin + '/auth/callback_deadliner.html');
if (kakaoBtn)  kakaoBtn.onclick  = () => { window.location.href = `${OAUTH_BASE}/oauth2/authorization/kakao?redirect_uri=${redirect}`; };
if (googleBtn) googleBtn.onclick = () => { window.location.href = `${OAUTH_BASE}/oauth2/authorization/google?redirect_uri=${redirect}`; };

/* ---- 로컬 로그인 ---- */
loginForm.onsubmit = async (e)=>{
  e.preventDefault();
  const email = loginEmail.value.trim();
  const password = loginPw.value.trim();
  if(!email || !password){ toast('이메일/비밀번호를 입력하세요.'); return; }
  try{
    const data = await jfetch(ENDPOINTS.login, { method:'POST', body:{ email, password } });
    const raw = data?.access_token || data?.accessToken;
    if(!raw){ toast('로그인 실패'); return; }
    // 저장 키 통일
    const tokenOnly = raw.startsWith('Bearer ') ? raw.slice(7) : raw;
    localStorage.setItem('accessToken', tokenOnly);

    // 유저 정보 저장
    try {
      const me = await jfetch(ENDPOINTS.me, { method: 'GET' });
      localStorage.setItem('me', JSON.stringify(me));
      let username = me?.name || email.split('@')[0];
      loginBtnText.textContent = (username||'User') + '님';
    } catch {
      localStorage.removeItem('me');
      loginBtnText.textContent = email.split('@')[0] + '님';
    }
    close(loginModal);
    toast('로그인 완료');
    loadAll();
  }catch(err){
    toast('로그인 실패: ' + err.message);
  }
};

/* ---- 회원가입 ---- */
signupForm.onsubmit = async (e)=>{
  e.preventDefault();
  const name = signupName.value.trim();
  const email = signupEmail.value.trim();
  const pw = signupPw.value.trim();
  const pw2 = signupPw2.value.trim();
  if(!name || !email || !pw || !pw2){ toast('모든 항목을 입력하세요.'); return; }
  if(pw !== pw2){ toast('비밀번호가 일치하지 않습니다.'); return; }
  try{
    await jfetch(ENDPOINTS.signup, { method:'POST', body:{ name, email, password: pw } });
    toast('회원가입 완료! 이제 로그인 해주세요.');
    // 로그인 모달로 전환 + 이메일 채워넣기
    close(signupModal);
    open(loginModal);
    loginEmail.value = email;
    loginPw.focus();
  }catch(err){
    toast('회원가입 실패: ' + err.message);
  }
};

/* ---- 로그아웃 확인 모달 ---- */
function showLogoutConfirm() {
  let modal = document.getElementById('logoutModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'logoutModal';
    modal.style.position = 'fixed';
    modal.style.inset = '0';
    modal.style.zIndex = '9999';
    modal.style.background = 'rgba(0,0,0,0.18)';
    modal.style.display = 'flex';
    modal.style.alignItems = 'center';
    modal.style.justifyContent = 'center';
    modal.innerHTML = `
      <div style="background:#fff;padding:32px 32px 24px 32px;border-radius:16px;max-width:320px;width:96vw;box-shadow:0 4px 24px rgba(0,0,0,0.12);position:relative;display:flex;flex-direction:column;gap:18px;">
        <button id="logoutModalClose" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;">&times;</button>
        <div style="font-size:18px;font-weight:700;text-align:center;margin-bottom:8px;">로그아웃 하시겠습니까?</div>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:12px;">
          <button id="logoutCancel" style="background:#eee;color:#223044;border-radius:8px;padding:8px 18px;font-weight:700;border:none;cursor:pointer;">취소</button>
          <button id="logoutConfirm" style="background:#232B44;color:#fff;border-radius:8px;padding:8px 18px;font-weight:700;border:none;cursor:pointer;">로그아웃</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    document.getElementById('logoutModalClose').onclick = () => { modal.style.display = 'none'; };
    document.getElementById('logoutCancel').onclick = () => { modal.style.display = 'none'; };
    document.getElementById('logoutConfirm').onclick = async () => {
      const btn = document.getElementById('logoutConfirm');
      const cancelBtn = document.getElementById('logoutCancel');
      btn.disabled = true; cancelBtn.disabled = true;
      try {
        try {
          await fetch(API_BASE + ENDPOINTS.logout, {
            method: 'POST',
            headers: { accept:'application/json;charset=UTF-8', ...authHeader() },
          });
        } catch(e){ /* 네트워크 에러는 무시 */ }
      } finally {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('me'); // 유저 정보도 함께 삭제
        loginBtnText.textContent = 'Log in';
        modal.style.display = 'none';
        toast('로그아웃 완료');
        // Immediately refresh UI after logout
        location.reload();
      }
    };
  } else {
    modal.style.display = 'flex';
  }
}

/* ========= 캘린더 ========= */
const monthLabel = document.getElementById('monthLabel');
const daysEl = document.getElementById('days');
// KST 기준으로 달력 시작일 계산
let cur = new Date(Date.now() + 9 * 60 * 60 * 1000); cur.setDate(1);

function pad(n){ return String(n).padStart(2,'0'); }
function toISO(d, end=false){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${end?'23:59:59':'00:00:00'}+09:00`;
}

async function renderCalendar(){
  const y = cur.getFullYear(), m = cur.getMonth();
  monthLabel.textContent = cur.toLocaleString('en-US', {month:'long'}) + `, ${y}`;

  // fetch events for visible month (KST 기준)
  const start = new Date(Date.UTC(y, m, 1, 0, 0, 0) + 9 * 60 * 60 * 1000);
  const end   = new Date(Date.UTC(y, m+1, 0, 0, 0, 0) + 9 * 60 * 60 * 1000);
  let dots = new Set();           // dates with events
  let deadlines = new Set();      // dates with deadlines
  try{
    const res = await jfetch(ENDPOINTS.calendarEvents, { params:{
      from: toISO(start,false), to: toISO(end,true), page:0, size:200
    }});
    const arr = res.items ?? res ?? [];
    arr.forEach(ev=>{
      const d = (ev.dueAt ?? ev.due_at ?? '').slice(0,10);
      if(d) dots.add(d);
      if(ev.has_deadline === true || ev.hasDeadline === true){
        if(d) deadlines.add(d);
      }
    });
  }catch(e){ /* ignore */ }

  // grid
  daysEl.innerHTML = '';
  // KST 기준으로 달력 날짜 계산
  const firstDow = new Date(Date.UTC(y, m, 1, 0, 0, 0) + 9 * 60 * 60 * 1000).getDay();
  const lastDatePrev = new Date(Date.UTC(y, m, 0, 0, 0, 0) + 9 * 60 * 60 * 1000).getDate();
  const lastDateCur  = new Date(Date.UTC(y, m+1, 0, 0, 0, 0) + 9 * 60 * 60 * 1000).getDate();
  // 오늘 날짜를 KST로 계산
  const kstNow = new Date(Date.now() + 9 * 60 * 60 * 1000);
  const todayStr = kstNow.toISOString().slice(0,10);

  // previous month fillers
  for(let i=0;i<firstDow;i++){
    const d = lastDatePrev-firstDow+i+1;
    const el = cell(new Date(y, m-1, d), true);
    daysEl.appendChild(el);
  }
  // current month
  for(let d=1; d<=lastDateCur; d++){
    const date = new Date(y, m, d);
    const el = cell(date, false, dots, deadlines, todayStr);
    daysEl.appendChild(el);
  }
  // next month fillers to complete 6 rows
  const cells = daysEl.children.length;
  for(let i=0;i<42-cells;i++){
    const el = cell(new Date(y, m+1, i+1), true);
    daysEl.appendChild(el);
  }
}
function cell(date, muted=false, dots=new Set(), deadlines=new Set(), todayStr=''){
  const el = document.createElement('div');
  el.className = 'd'+(muted?' muted':'');
  // KST 기준으로 날짜 문자열 생성
  const kstDate = new Date(date.getTime() + 9 * 60 * 60 * 1000);
  const dstr = `${kstDate.getFullYear()}-${pad(kstDate.getMonth()+1)}-${pad(kstDate.getDate())}`;
  if(dots.has(dstr)) el.classList.add('dot');
  if(deadlines.has(dstr)) el.classList.add('deadline');
  if(dstr===todayStr) el.classList.add('today');
  el.innerHTML = `<div class="num">${date.getDate()}</div>`;
  return el;
}

document.getElementById('prevM').onclick = ()=>{ cur.setMonth(cur.getMonth()-1); renderCalendar(); }
document.getElementById('nextM').onclick = ()=>{ cur.setMonth(cur.getMonth()+1); renderCalendar(); }

/* ========= Ongoing Works (right rail) ========= */
function daysRemaining(dueAt){
  const now = new Date(), due = new Date(dueAt);
  const diff = Math.ceil((due-now)/(1000*60*60*24));
  return diff>0?`${diff} days remaining`:'Due';
}
async function renderWorks(){
  const wrap = document.getElementById('works');
  wrap.innerHTML = '';
  try{
    const res = await jfetch(ENDPOINTS.deadlines);
    const today = new Date();
    today.setHours(0,0,0,0);
    let arr = (res?.deadlines ?? [])
      .map(d => ({
        deadlineId: d.deadline_id ?? d.deadlineId ?? d.id,
        title: d.event?.title ?? '(Untitled)',
        dueAt: d.event?.due_at ?? d.event?.dueAt ?? '',
        startAt: d.event?.start_at ?? d.event?.startAt ?? '',
        note: d.note ?? '',
      }))
      .filter(d => {
        if (!d.dueAt) return true; // keep if no due date
        const dueDate = new Date(d.dueAt);
        dueDate.setHours(0,0,0,0);
        return dueDate >= today;
      });
    // Sort by due date ascending (most urgent first)
    arr = arr.sort((a, b) => {
      if (!a.dueAt && !b.dueAt) return 0;
      if (!a.dueAt) return 1;
      if (!b.dueAt) return -1;
      return new Date(a.dueAt) - new Date(b.dueAt);
    });
    
    if(!arr.length){ wrap.innerHTML = `<div class="muted" style="margin:8px 6px">No projects yet.</div>`; return; }
    // group by title
    const groups = new Map();
    arr.forEach(d => {
      if(!groups.has(d.title)) groups.set(d.title, []);
      groups.get(d.title).push(d);
    });
    function getProgressPercent(startDate, dueDate) {
      const start = new Date(startDate);
      const end = new Date(dueDate);
      const now = new Date();
      if (isNaN(start) || isNaN(end)) return 0;
      if (now < start) return 0;
      if (now > end) return 100;
      const total = end - start;
      const passed = now - start;
      return Math.round((passed / total) * 100);
    }
    function getBarColor(dueAt) {
      if (!dueAt) return '#1aa3d9'; // default blue
      const today = new Date(); today.setHours(0,0,0,0);
      const due = new Date(dueAt); due.setHours(0,0,0,0);
      const diff = Math.ceil((due - today) / (1000*60*60*24));
      if (diff === 0) return '#e05a5a'; // today: red
      if (diff > 0 && diff <= 3) return '#f7b731'; // <=3 days: yellow
      if (diff >= 4 && diff <= 7) return '#f5cd79'; // 4-7 days: light yellow
      if (diff >= 14) return '#2ecc71'; // >=14 days: green
      return '#1aa3d9'; // default blue
    }
    [...groups.entries()].slice(0,6).forEach(([title, list])=>{
      const first = list[0];
      const dueAt = first.dueAt;
      let startAt = first.startAt;
      if (!startAt && dueAt) {
        const d = new Date(dueAt);
        d.setDate(d.getDate() - 14);
        startAt = d.toISOString().slice(0,10);
      }
      const percent = (dueAt && startAt) ? getProgressPercent(startAt, dueAt) : 0;
      const barColor = getBarColor(dueAt);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="p-ttl">${title}</div>
        <div class="meta">${first.note ? first.note : ''}</div>
        <div class="bar"><i style="width:${percent}%;background:${barColor};"></i></div>
        <div class="days-left">${dueAt?daysRemaining(dueAt):''}</div>
      `;
      card.onclick = ()=>{ location.href = '/ongoingworks.html'; };
      wrap.appendChild(card);
    });
  }catch(e){
    wrap.innerHTML = `<div class="muted" style="margin:8px 6px">불러오기 실패: ${e.message}</div>`;
  }
}

/* ===== Bell (Today's Alerts) ===== */
const bellBtn = document.getElementById('bellBtn');
const bellPanel = document.getElementById('bellPanel');
const bellSummary = document.getElementById('bellSummary');
const bellList = document.getElementById('bellList');
const bellRefresh = document.getElementById('bellRefresh');
const TODAY_ENDPOINT = '/api/alerts/deadlines/today';

async function fetchTodayAlerts(){
  try{
    const res = await jfetch(TODAY_ENDPOINT, { params:{ tz:'Asia/Seoul' }});
    const items = res?.items ?? res ?? [];
    bellSummary.textContent = `${res.date ?? ''} · ${res.count ?? items.length}건`;
    bellList.innerHTML = items.map(it=>`
      <div style="margin:8px 0; padding:10px; border:1px solid #eef0f4; border-radius:10px; background:#FCFCE5;">
        <div style="display:flex; align-items:center; gap:8px;">
          <b>${it.title ?? '(Untitled)'}</b>
          ${it.deadline ? `<span class="badge">progress ${it.deadline.progress ?? 0}%</span>` : `<span class="badge" style="background:#fffbe6;color:#9f6b3d">no deadline</span>`}
          <div class="sp"></div>
          <small class="muted">${(it.dueAt ?? '').replace('T',' ')}</small>
        </div>
        ${it.memo ? `<div style="margin-top:6px; color:#232B44; white-space:pre-wrap">${it.memo}</div>` : ''}
      </div>
    `).join('') || '<div class="muted" style="padding:8px">알림이 없습니다.</div>';
  }catch(e){
    bellSummary.textContent = '불러오기 실패: ' + e.message;
    bellList.innerHTML = '';
  }
}
function toggleBell(e){
  e?.stopPropagation();
  const show = bellPanel && bellPanel.style.display !== 'block';
  if(!bellPanel) return;
  bellPanel.style.display = show ? 'block' : 'none';
  if(show) { fetchTodayAlerts(); }
}
bellBtn && bellBtn.addEventListener('click', toggleBell);
bellRefresh && bellRefresh.addEventListener('click', (e)=>{ e.stopPropagation(); fetchTodayAlerts(); });
document.addEventListener('click', (e)=>{
  const within = e.target.closest('#bellPanel') || e.target.closest('#bellBtn');
  if(!within && bellPanel){ bellPanel.style.display = 'none'; }
});

/* ========= Boot ========= */
async function loadAll(){
  await Promise.all([renderCalendar(), renderWorks()]);
}
loadAll();
