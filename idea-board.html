<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idea Board</title>
  <link rel="stylesheet" href="main.css" />
  <style>
    body {
      background: #fffbe6;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
    }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 200px;
      height: 100vh;
      background: #223044;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
    }
    .sidebar h2 {
      font-size: 1.5em;
      margin-bottom: 40px;
      font-weight: bold;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
      width: 100%;
    }
    .sidebar ul li {
      padding: 15px 0 15px 30px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sidebar ul li:hover {
      background: #2c3e50;
    }
    .main {
      margin-left: 220px;
      padding: 40px;
      min-height: 100vh;
      background: #fffbe6;
    }
    .board-header {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 30px;
      color: #223044;
    }
    .idea-board {
      position: relative;
      min-height: 400px;
    }
    .idea-card {
      min-width: 200px;
      min-height: 120px;
      padding: 20px;
      border-radius: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      font-size: 1.1em;
      font-weight: 500;
      position: absolute;
      cursor: pointer;
      word-break: break-word;
    }
    .idea-card .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 1em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .add-idea-btn {
  background: #0099cc;
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 12px 32px;
  font-size: 1.1em;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 30px;
  float: right;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: background 0.2s;
  z-index: 9999;
  position: relative;
    }
    .add-idea-btn:hover {
      background: #0077aa;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 5000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.2);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #fff;
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.15);
      min-width: 350px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .modal-content label {
      font-weight: bold;
      color: #223044;
    }
    .modal-content input,
    .modal-content textarea,
    .modal-content select {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }
    .modal-actions button {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-actions .cancel {
      background: #eee;
      color: #223044;
    }
    .modal-actions .confirm {
      background: #0099cc;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>🪶 Deadliner</h2>
    <ul>
      <li onclick="location.href='main.html'">Home</li>
      <li onclick="location.href='deadLiner-dashBoard.html'">Calender</li>
      <li onclick="location.href='idea-board.html'" style="background:#2c3e50;">Idea</li>
      <li onclick="location.href='myproofticket.html'">Proof ticket</li>
      <li onclick="location.href='my-page.html'">My Page</li>
    </ul>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="board-header">Idea Board</div>
    <button class="add-idea-btn" id="addIdeaOpenBtn">+ Add Idea</button>
    <div id="colorBar" style="position:relative;width:132px;height:34px;margin:16px 0 24px 0;">
      <div style="width:132px;height:34px;position:absolute;left:0;top:0;background:#BABABA;border-radius:78px;"></div>
      <div class="color-icon" data-color="#CCE5FF" style="width:24px;height:24px;position:absolute;left:8px;top:5px;background:#CCE5FF;border-radius:9999px;cursor:pointer;"></div>
      <div class="color-icon" data-color="#B2F2C9" style="width:24px;height:24px;position:absolute;left:38px;top:5px;background:#B2F2C9;border-radius:9999px;cursor:pointer;"></div>
      <div class="color-icon" data-color="#FFE066" style="width:24px;height:24px;position:absolute;left:68px;top:5px;background:#FFE066;border-radius:9999px;cursor:pointer;"></div>
      <div class="color-icon" data-color="#FFD6E0" style="width:24px;height:24px;position:absolute;left:98px;top:5px;background:#FFD6E0;border-radius:9999px;cursor:pointer;"></div>
    </div>
    <button class="add-idea-btn" id="loginOpenBtn" style="background:#223044;margin-right:10px;float:left;">Login</button>
    <div class="idea-board" id="ideaBoard"></div>
    <button id="saveAllBtn"
      style="position:fixed;bottom:32px;right:32px;z-index:2000;background:#0099cc;color:#fff;border:none;border-radius:16px;padding:16px 32px;font-size:1.2em;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer;">
      저장
    </button>
  </div>

  <!-- Add Idea Modal -->
  <div class="modal" id="ideaModal">
    <div class="modal-content">
      <h2>Add New Idea</h2>
      <label for="detail">Detail</label>
      <textarea id="detail" rows="3" placeholder="Enter your idea..."></textarea>
      <div class="modal-actions">
        <button class="cancel" id="addIdeaCancelBtn">Cancel</button>
        <button class="confirm" id="addIdeaBtn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h2>Edit Idea</h2>
      <label for="editColor">Color</label>
      <select id="editColor">
        <option value="#b2f2c9">Mint</option>
        <option value="#ffe066">Yellow</option>
        <option value="#ffd6e0">Pink</option>
        <option value="#cce5ff">Blue</option>
      </select>
      <label for="editDetail">Detail</label>
      <textarea id="editDetail" rows="3"></textarea>
      <div class="modal-actions">
        <button class="cancel" id="editCancelBtn">Cancel</button>
        <button class="confirm" id="editConfirmBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2>Login</h2>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="Enter email">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password">
      <div class="modal-actions">
        <button class="cancel" id="loginCancelBtn">Cancel</button>
        <button class="confirm" id="loginConfirmBtn">Login</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { listIdeas, addIdeaBoard, deleteIdeaBoard, loginUser, updateIdeaBoard } from './js/apiClient.js';

    let _modifiedIdeas = {};
    let _lastIdeas = [];

    const ideaBoard = document.getElementById('ideaBoard');
    const ideaModal = document.getElementById('ideaModal');
    const loginModal = document.getElementById('loginModal');
    const editModal = document.getElementById('editModal');

    // ✅ 모달 열기/닫기
    const openModal = () => (ideaModal.style.display = 'flex');
    const closeModal = () => {
      ideaModal.style.display = 'none';
      document.getElementById('detail').value = '';
    };

    const openLoginModal = () => (loginModal.style.display = 'flex');
    const closeLoginModal = () => {
      loginModal.style.display = 'none';
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
    };

    const openEditModal = (idea) => {
      editModal.style.display = 'flex';
      document.getElementById('editColor').value = idea.color;
      document.getElementById('editDetail').value = idea.detail;
      editModal.dataset.ideaId = idea.idea_id;
    };

    const closeEditModal = () => {
      editModal.style.display = 'none';
      document.getElementById('editDetail').value = '';
    };

    // ✅ 이벤트 등록
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('addIdeaOpenBtn').onclick = openModal;
      document.getElementById('addIdeaCancelBtn').onclick = closeModal;
      document.getElementById('addIdeaBtn').onclick = addIdea;
      document.getElementById('loginOpenBtn').onclick = openLoginModal;
      document.getElementById('loginCancelBtn').onclick = closeLoginModal;
      document.getElementById('loginConfirmBtn').onclick = loginUserAction;
      document.getElementById('editCancelBtn').onclick = closeEditModal;
      document.getElementById('editConfirmBtn').onclick = saveEditIdea;
      document.getElementById('saveAllBtn').onclick = saveAllIdeas;
      fetchIdeas();
    });

    // ✅ 함수 정의
    async function fetchIdeas() {
      try {
        const res = await listIdeas();
        _lastIdeas = res?.result?.result ?? [];
        renderIdeas(_lastIdeas);
      } catch (err) {
        ideaBoard.innerHTML = `<div style="color:red;">${err.message}</div>`;
      }
    }

    function renderIdeas(ideas) {
      ideaBoard.innerHTML = '';
      ideas.forEach((idea) => {
        const card = document.createElement('div');
        card.className = 'idea-card';
        card.style.background = idea.color;
        card.style.left = (idea.x ?? idea.position_x) + 'px';
        card.style.top = (idea.y ?? idea.position_y) + 'px';
        card.style.width = (idea.w ?? idea.width ?? 200) + 'px';
        card.style.height = (idea.h ?? idea.height ?? 120) + 'px';
        card.innerHTML = `
          <span class="card-text">${idea.detail}</span>
          <button class="delete-btn" data-id="${idea.idea_id}">&times;</button>
          <div class="resize-handle" style="position:absolute;right:2px;bottom:2px;width:16px;height:16px;background:#ccc;border-radius:4px;cursor:nwse-resize;"></div>
        `;
        card.querySelector('.delete-btn').onclick = (e) => {
          e.stopPropagation();
          deleteIdea(idea.idea_id);
        };
        // --- Double click for text edit ---
        let editing = false;
        card.querySelector('.card-text').addEventListener('dblclick', function(e) {
          if (editing) return;
          editing = true;
          const span = e.target;
          const input = document.createElement('input');
          input.type = 'text';
          input.value = span.textContent;
          input.style.width = '90%';
          input.style.fontSize = '1em';
          input.style.borderRadius = '8px';
          input.style.border = '1px solid #ccc';
          span.replaceWith(input);
          input.focus();
          input.addEventListener('blur', finishEdit);
          input.addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') finishEdit();
          });
          function finishEdit() {
            const newText = input.value;
            idea.detail = newText;
            _modifiedIdeas[idea.idea_id] = {
              ...( _modifiedIdeas[idea.idea_id] || {} ),
              detail: newText
            };
            input.replaceWith(span);
            span.textContent = newText;
            editing = false;
          }
        });
        // --- Drag logic ---
        let isDragging = false, dragOffsetX = 0, dragOffsetY = 0;
        function onMouseMove(e) {
          if (!isDragging) return;
          const newX = e.clientX - dragOffsetX;
          const newY = e.clientY - dragOffsetY;
          card.style.left = newX + 'px';
          card.style.top = newY + 'px';
        }
        function onMouseUp(e) {
          if (isDragging) {
            isDragging = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            idea.x = parseInt(card.style.left);
            idea.y = parseInt(card.style.top);
            _modifiedIdeas[idea.idea_id] = {
              ...( _modifiedIdeas[idea.idea_id] || {} ),
              x: idea.x,
              y: idea.y
            };
          }
        }
        card.addEventListener('mousedown', function(e) {
          if (e.target.classList.contains('resize-handle') || editing) return;
          isDragging = true;
          dragOffsetX = e.clientX - card.offsetLeft;
          dragOffsetY = e.clientY - card.offsetTop;
          card.style.zIndex = 1001;
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });
        // --- Resize logic ---
        let isResizing = false, resizeStartW = 0, resizeStartH = 0, resizeStartX = 0, resizeStartY = 0;
        function onResizeMove(e) {
          if (!isResizing) return;
          const newW = Math.max(100, resizeStartW + (e.clientX - resizeStartX));
          const newH = Math.max(60, resizeStartH + (e.clientY - resizeStartY));
          card.style.width = newW + 'px';
          card.style.height = newH + 'px';
        }
        function onResizeUp(e) {
          if (isResizing) {
            isResizing = false;
            document.removeEventListener('mousemove', onResizeMove);
            document.removeEventListener('mouseup', onResizeUp);
            idea.w = parseInt(card.style.width);
            idea.h = parseInt(card.style.height);
            _modifiedIdeas[idea.idea_id] = {
              ...( _modifiedIdeas[idea.idea_id] || {} ),
              w: idea.w,
              h: idea.h
            };
          }
        }
        const resizeHandle = card.querySelector('.resize-handle');
        resizeHandle.addEventListener('mousedown', function(e) {
          isResizing = true;
          resizeStartW = card.offsetWidth;
          resizeStartH = card.offsetHeight;
          resizeStartX = e.clientX;
          resizeStartY = e.clientY;
          e.stopPropagation();
          document.addEventListener('mousemove', onResizeMove);
          document.addEventListener('mouseup', onResizeUp);
        });
        // --- Color change ---
        card.addEventListener('click', function(e) {
          if (window._selectedColor && !editing && !e.target.classList.contains('delete-btn') && !e.target.classList.contains('resize-handle')) {
            card.style.background = window._selectedColor;
            idea.color = window._selectedColor;
            _modifiedIdeas[idea.idea_id] = {
              ...( _modifiedIdeas[idea.idea_id] || {} ),
              color: window._selectedColor
            };
          }
        });
        ideaBoard.appendChild(card);
      });
      // Color bar logic
      window._selectedColor = null;
      document.querySelectorAll('.color-icon').forEach(icon => {
        icon.addEventListener('click', function() {
          window._selectedColor = this.dataset.color;
          document.querySelectorAll('.color-icon').forEach(i => i.style.outline = 'none');
          this.style.outline = '3px solid #333';
        });
      });
    }

    async function addIdea() {
      const detail = document.getElementById('detail').value;
      if (!detail.trim()) return alert('내용을 입력하세요.');
      try {
        const res = await addIdeaBoard({ x: 100, y: 100, w: 200, h: 120, color: "#ffe066", detail });
        closeModal();
        alert('아이디어가 추가되었습니다!');
        fetchIdeas();
      } catch (err) {
        alert('추가 실패: ' + err.message);
      }
    }

    async function deleteIdea(id) {
      if (!confirm('삭제하시겠습니까?')) return;
      try {
        await deleteIdeaBoard(id);
        alert('삭제 완료!');
        fetchIdeas();
      } catch (err) {
        alert('삭제 실패: ' + err.message);
      }
    }

    async function loginUserAction() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) return alert('이메일과 비밀번호를 입력하세요.');
      try {
        await loginUser({ email, password });
        closeLoginModal();
        alert('로그인 성공!');
        fetchIdeas();
      } catch (err) {
        alert('로그인 실패: ' + err.message);
      }
    }

    function saveEditIdea() {
      const ideaId = Number(editModal.dataset.ideaId);
      const newDetail = document.getElementById('editDetail').value;
      const newColor = document.getElementById('editColor').value;
      _modifiedIdeas[ideaId] = { detail: newDetail, color: newColor };
      closeEditModal();
      alert('임시 수정 완료. 저장 버튼을 눌러 반영하세요.');
    }

async function saveAllIdeas() {
  if (Object.keys(_modifiedIdeas).length === 0) {
    return alert('수정된 내용이 없습니다.');
  }

  let count = 0;

  for (const idea of _lastIdeas) {
    const ideaId = idea.idea_id;
    const edited = _modifiedIdeas[ideaId] ?? {};

    const newX = Number.isFinite(idea.x) ? Math.floor(idea.x) : Math.floor(idea.position_x ?? 100);
    const newY = Number.isFinite(idea.y) ? Math.floor(idea.y) : Math.floor(idea.position_y ?? 100);
    const newW = Number.isFinite(idea.w) && idea.w > 0 ? Math.floor(idea.w) : Math.floor(idea.width ?? 200);
    const newH = Number.isFinite(idea.h) && idea.h > 0 ? Math.floor(idea.h) : Math.floor(idea.height ?? 120);

    // ✅ 서버 스펙에 맞게 필드명 수정
    const payload = {
      x: newX,
      y: newY,
      w: newW,
      h: newH,
      color: edited.color ?? idea.color,
      detail: edited.detail ?? idea.detail
    };

    console.log('[PATCH]', ideaId, payload);

    try {
      const res = await updateIdeaBoard(ideaId, payload);
      console.log('[PATCH OK]', res);
      if (res.isSuccess) count++;
      else console.warn('[PATCH FAIL]', res.message);
    } catch (err) {
      console.error('[PATCH ERROR]', ideaId, err);
    }
  }

  _modifiedIdeas = {};
  fetchIdeas();
  alert(`${count}개의 아이디어가 저장되었습니다!`);
}


  </script>
</body>
</html>
