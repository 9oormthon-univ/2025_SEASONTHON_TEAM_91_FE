<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>작품 보호 완료 - ProofTicket</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#141414; --text:#E5E7EB; --accent:#06C270;
      --btn-bg:#232323; --btn-text:#fff; --btn-border:#fff;
      /* 티켓 스케일 */
      --ticket-scale: 0.82;
    }
    *{box-sizing:border-box}

    html,body{
      height:100%; margin:0; background:var(--bg);
      font-family:Roboto, Inter, system-ui, -apple-system, Segoe UI, Noto Sans KR, sans-serif;
      color:var(--text);
      overflow:hidden;   /* 필수: 드래그 스크롤 방지 */
      user-select:none;
    }
    body{
      display:flex; justify-content:center; align-items:flex-start;
      padding:40px 24px;
    }

    .container{ width:100%; display:flex; flex-direction:column; align-items:center; overflow:hidden; }

    .logo{
      position:absolute; left:55px; top:40px; width:80px; height:80px; z-index:10;
      -webkit-user-drag:none;
    }

    h1{
        font-size:48px; font-weight:700; color:var(--accent);
      margin:0 0 0; text-align:center;
    }
    .subtitle{
      font-size:24px; font-weight:400; color:var(--text);
      margin:0; text-align:center;
    }

    /* 티켓 두 장 래퍼 */
    .tickets{
      display:flex; justify-content:center; align-items:flex-start;
      gap: clamp(20px, 4vw, 48px);
      margin:24px 0 0 0;
      position:relative; z-index:1;
      -webkit-user-drag:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
      touch-action:none;
    }

    /* 스케일에 맞춘 실제 레이아웃 크기 */
    .ticketContainer{
      width: calc(460px * var(--ticket-scale));
      height: calc(787px * var(--ticket-scale));
      position:relative;
      transform-style:preserve-3d;
      will-change:transform;
      border-radius:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }

    /* 커스텀 엘리먼트 호스트 크기 */
    proof-ticket{
      display:block;
      scale: 0.8;
      background:transparent;
      position:relative;
    }

    /* 홀로그램 오버레이 */
.lightOverlay{
  position:absolute; inset:0; z-index:3; pointer-events:none; border-radius:14px;
  margin-left: -2.5%;
  margin-top: -4.5%;
  mix-blend-mode: color-dodge;
  background: linear-gradient(105deg,
              transparent 40%,
              rgba(255,219,112,0.8) 45%,
              rgba(132,50,255,0.6) 50%,
              transparent 54%);
  filter: brightness(1.4) opacity(0.9);
  background-size:250% 250%;
  background-position:52%;
  transition: background-position .1s;

  --fade-start: 78%;
  --fade-end: 97%;

  /* 티켓 모양 마스크 */
  -webkit-mask-image: url('public/images/ticket-shape.svg'),
                      radial-gradient(
    circle at 50% 50%,
    rgba(0,0,0,1) var(--fade-start),
    rgba(0,0,0,0) var(--fade-end)
  );
  mask-image:         url('public/images/ticket-shape.svg'),
                      radial-gradient(
    circle at 50% 50%,
    rgba(0,0,0,1) var(--fade-start),
    rgba(0,0,0,0) var(--fade-end)
  );
  -webkit-mask-composite: intersect; /* WebKit */
  mask-composite: intersect;         /* 표준 */
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  -webkit-mask-position:center;
  mask-position:center;
  -webkit-mask-size: 84% 80%, cover; /* 첫 번째는 티켓, 두 번째는 radial */
  mask-size:         80% 78%, cover;
}



    .buttons{
      display:flex; gap:36px; justify-content:center;
      width:100%; max-width:800px; margin-top:28px;
    }
    .btn{
      flex:1; height:54px; border-radius:20px; border:1.7px solid var(--btn-border);
      background:var(--btn-bg); color:var(--btn-text);
      font:700 16px/1 Inter, Roboto, sans-serif; letter-spacing:2px; text-transform:uppercase;
      display:flex; align-items:center; justify-content:center; gap:12px;
      cursor:pointer; transition:background .18s, color .18s;
    }
    .btn.white{ background:#fff; color:#232323; border-color:#fff; }
    .btn svg{ width:28px; height:28px; }

    /* 모바일: 세로 정렬 */
    @media (max-width: 900px){
      .tickets{ flex-direction:column; }
      .buttons{ flex-direction:column; gap:20px; max-width:none; }
      .btn{ flex:none; width:100%; }
    }
  </style>
</head>
<body>
  <a href="main.html" class="logo-link" id="logoLink" style="position: fixed; left: 56px; top: 40px; z-index: 100;">
    <img class="logo" src="public/images/logo.svg" alt="Proof Ticket Logo" />
  </a>
  <a href="deadLiner-dashBoard.html" class="deadliner-link" id="deadlinerLink" style="position: fixed; left: 120px; top: 140px; z-index: 100;">
    <img src="public/icons/deadliner-mainicon.svg" alt="Go to Deadliner Dashboard" style="width:96px;height:96px;" />
  </a>
  <script>
    // 모든 페이지에서 로고 클릭 시 로그아웃
    document.getElementById('logoLink')?.addEventListener('click', function(e) {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('me');
      sessionStorage.clear();
    });
  </script>

  <div class="container">
    <h1 class="title">작품 검증 완료</h1>
    <p class="subtitle">제출하신 작품이 검증되었어요!</p>

    <div class="tickets">
      <div class="ticketContainer">
        <div class="lightOverlay"></div>
        <!-- 앞면 -->
        <proof-ticket id="tFront"
          side="front"
          shape-src="public/images/ticket-shape.svg"
          scale="0.8">
        </proof-ticket>
      </div>

      <div class="ticketContainer">
        <div class="lightOverlay"></div>
        <!-- 뒷면 -->
        <proof-ticket id="tBack"
          side="back"
          shape-src="public/images/ticket-shape.svg"
          scale="0.8">
        </proof-ticket>
      </div>
    </div>

    <div class="buttons">
      <button class="btn" onclick="location.href='myproofticket.html'">
        ← 뒤로 가기
      </button>

      <button class="btn" onclick="location.href='myproofticket.html'">
        <img src="public/images/map.svg">
        전체 티켓 보러가기
      </button>

      <!-- <button class="btn" onclick="window.print()">
        <img src="public/images/download.svg">
        PDF 다운로드
      </button> -->

      <button class="btn" id="btnDownloadOriginal">
        <img src="public/images/download.svg">
        원본 파일 저장
      </button>

      <button class="btn" onclick="location.href='register.html'">
        <svg viewBox="0 0 28 28" fill="none"><path d="M14 5v18" stroke="white" stroke-width="2"/><path d="M5 14h18" stroke="white" stroke-width="2"/></svg>
        다른 작품 등록하기
      </button>
    </div>
  </div>

  
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);

    const title = params.get('h1');
    const subtitle = params.get('subtitle');

    if (title) document.getElementById('pageTitle').textContent = title;
    if (subtitle) document.getElementById('pageSubtitle').textContent = subtitle;
  });
</script>
  

  <script type="module">
    import { getVerifyDetail } from './js/apiClient.js';
  
    // ✅ ticketId / ticket_id / id 모두 지원
    function resolveTicketId() {
      const sp = new URLSearchParams(location.search);
      for (const k of ['ticketId', 'ticket_id', 'id']) {
        const v = sp.get(k);
        if (v != null && v !== '' && Number.isFinite(Number(v))) return Number(v);
      }
      const ss = sessionStorage.getItem('lastTicketId');
      if (ss && Number.isFinite(Number(ss))) return Number(ss);
      const ls = localStorage.getItem('lastTicketId');
      if (ls && Number.isFinite(Number(ls))) return Number(ls);
      return null;
    }
  
    // YYYY/MM/DD
    const fmtDate = (iso='') => (String(iso).split('T')[0] || String(iso).split(' ')[0] || '').replaceAll('-', '/');
  
    // proof-ticket 주입
    const tFront = document.getElementById('tFront');
    const tBack  = document.getElementById('tBack');
    function apply(el, r) {
      el?.setAttribute('front-image', r?.contest?.image_url || './posters/poster7.png');
      el?.setAttribute('title',       r?.contest?.name || '');
      el?.setAttribute('proof-code',  r?.human_code || '');
      el?.setAttribute('timestamp',   r?.issued_at  || '');
      el?.setAttribute('hash',        r?.sha256     || '');
      el?.setAttribute('file-name',   r?.file_name_submitted || '');
      el?.setAttribute('owner',       r?.owner?.name || '');
      el?.setAttribute('date-right',  fmtDate(r?.issued_at));
    }
  
    // ✅ 커스텀 엘리먼트 준비를 기다리되, 최대 1초만 기다리고 넘김 (API 호출은 선행)
    function whenProofTicketReady(timeoutMs = 1000) {
      const ready = customElements.get('proof-ticket')
        ? Promise.resolve()
        : customElements.whenDefined('proof-ticket');
      const to = new Promise(res => setTimeout(res, timeoutMs));
      return Promise.race([ready, to]);
    }
  
    (async () => {
      try {
        console.debug('[protectcompleted] start, search =', location.search);
  
        const ticketId = resolveTicketId();
        console.debug('[protectcompleted] resolved ticketId =', ticketId);
        if (!Number.isFinite(ticketId)) {
          console.warn('[protectcompleted] ticketId/ticket_id 없음. 예) ?ticketId=2');
          return;
        }
        sessionStorage.setItem('lastTicketId', String(ticketId));
        localStorage.setItem('lastTicketId', String(ticketId));
  
        // ✅ API 먼저 호출 (여기서 막히면 진짜 API가 안 가는 것)
        console.debug('[protectcompleted] calling getVerifyDetail...');
        const { result } = await getVerifyDetail(ticketId);
        console.debug('[protectcompleted] API OK:', result);
  
        // ✅ 엘리먼트 준비는 최대 1초만 대기 (안되면 그냥 속성만 세팅)
        await whenProofTicketReady(1000);
  
        apply(tFront, result);
        apply(tBack,  result);
        tFront?.setAttribute('side', 'front');
        tBack ?.setAttribute('side',  'back');
        console.debug('[protectcompleted] ticket applied.');
      } catch (e) {
        console.error('[protectcompleted] 실패:', e);
      }
    })();
  
    // ===== 3D/스케일 기존 코드 유지 =====
    document.querySelectorAll('.ticketContainer').forEach(container => {
      const overlay = container.querySelector('.lightOverlay');
      const onMove = (x, y, rect) => {
        const nx = (x / rect.width) * 2 - 1;
        const ny = (y / rect.height) * 2 - 1;
        const rotY = nx * 10;
        const rotX = -ny * 10;
        container.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        if (overlay) overlay.style.backgroundPosition = `${(x/rect.width)*100}% ${(y/rect.height)*100}%`;
      };
      container.addEventListener('mousemove', e => {
        const r = container.getBoundingClientRect();
        onMove(e.clientX - r.left, e.clientY - r.top, r);
      });
      container.addEventListener('mouseleave', () => {
        container.style.transform = '';
        if (overlay) overlay.style.backgroundPosition = '80% 80%';
      });
      container.addEventListener('touchmove', e => {
        const t = e.touches[0];
        if (!t) return;
        const r = container.getBoundingClientRect();
        onMove(t.clientX - r.left, t.clientY - r.top, r);
        e.preventDefault();
      }, { passive: false });
    });
  
    function fitTicketsToViewport(){
      const ticketsWrap = document.querySelector('.tickets');
      if(!ticketsWrap) return;
      const h1 = document.querySelector('h1');
      const sub = document.querySelector('.subtitle');
      const btns = document.querySelector('.buttons');
      const vw = window.innerWidth, vh = window.innerHeight;
      const bs = getComputedStyle(document.body);
      const padTop = parseFloat(bs.paddingTop)||0, padBottom = parseFloat(bs.paddingBottom)||0;
      const padLeft = parseFloat(bs.paddingLeft)||0, padRight = parseFloat(bs.paddingRight)||0;
      const gap = parseFloat(getComputedStyle(ticketsWrap).gap)||0;
      const isColumn = getComputedStyle(ticketsWrap).flexDirection === 'column';
      const cols = isColumn ? 1 : 2;
      const usedH = (h1?.offsetHeight||0) + (sub?.offsetHeight||0) + (btns?.offsetHeight||0) + padTop + padBottom - 24;
      const availH = Math.max(200, vh - usedH);
      const sH = availH / 887;
      const availW = Math.max(200, vw - padLeft - padRight);
      const sW = (availW - (cols - 1) * gap) / (cols * 460);
      const s = Math.max(0.3, Math.min(1, sH, sW));
      document.documentElement.style.setProperty('--ticket-scale', s.toFixed(3));
      document.querySelectorAll('proof-ticket').forEach(el => el.setAttribute('scale', s.toFixed(3)));
    }
    window.addEventListener('load', fitTicketsToViewport);
    window.addEventListener('resize', fitTicketsToViewport);
  </script>
  <script type="module" src="./ticket.js"></script>

  <script>
    // 원본 PDF 다운로드 버튼 기능
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('btnDownloadOriginal');
      if (!btn) return;
      btn.addEventListener('click', async function() {
        // ticketId 추출 (동일 로직)
        function resolveTicketId() {
          const sp = new URLSearchParams(location.search);
          for (const k of ['ticketId', 'ticket_id', 'id']) {
            const v = sp.get(k);
            if (v != null && v !== '' && Number.isFinite(Number(v))) return Number(v);
          }
          const ss = sessionStorage.getItem('lastTicketId');
          if (ss && Number.isFinite(Number(ss))) return Number(ss);
          const ls = localStorage.getItem('lastTicketId');
          if (ls && Number.isFinite(Number(ls))) return Number(ls);
          return null;
        }
        const ticketId = resolveTicketId();
        if (!ticketId) {
          alert('티켓 정보를 찾을 수 없습니다.');
          return;
        }
        // accessToken 추출
        const accessToken = localStorage.getItem('accessToken');
        if (!accessToken) {
          alert('로그인이 필요합니다.');
          return;
        }
        try {
          const resp = await fetch(`https://api.rightmarks.site/api/tickets/${ticketId}/download`, {
            method: 'GET',
            headers: {
              'accept': 'application/json;charset=UTF-8',
              'Authorization': 'Bearer ' + accessToken
            }
          });
          const data = await resp.json();
          if (!resp.ok || data.isSuccess === false) {
            let msg = data?.message || '원본 파일을 찾을 수 없습니다.';
            alert(msg);
            return;
          }
          const fileUrl = data.result?.file_url || data.result?.fileUrl;
          if (!fileUrl) {
            alert('원본 파일이 존재하지 않습니다.');
            return;
          }
          // 파일 다운로드 트리거
          const a = document.createElement('a');
          a.href = fileUrl;
          a.download = '';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (e) {
          alert('다운로드 실패: ' + (e?.message || e));
        }
      });
    });
  </script>

  
  
  
  
</body>
</html>
