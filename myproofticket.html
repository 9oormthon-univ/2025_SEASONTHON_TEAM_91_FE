<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>유저1님의 Proof Tickets</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="myproofticket.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <a href="main.html" class="logo-link" id="logoLink" style="position: fixed; left: 56px; top: 40px; z-index: 100;">
    <img class="logo" src="public/images/logo.svg" alt="Proof Ticket Logo" />
  </a>
  <a href="deadLiner-dashBoard.html" class="deadliner-link" id="deadlinerLink" style="position: fixed; left: 56px; top: 200px; z-index: 100;">
    <img src="public/icons/deadliner-mainicon.svg" alt="Go to Deadliner Dashboard" style="width:96px;height:96px;" />
  </a>
  <script>
    // 모든 페이지에서 로고 클릭 시 로그아웃
    document.getElementById('logoLink')?.addEventListener('click', function(e) {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('me');
      sessionStorage.clear();
    });
  </script>

  <main class="page">
    <h1 class="title">유저1님의 Proof Tickets</h1>
    <div class="sort-icon" style="position: fixed; left: 40px; top: 150px; z-index: 100;">
      <img class="sort-icon" src="public/images/sortlinear.svg" alt="Proof Ticket Logo" />
    </div>
    <section class="wheel-wrap">
      <div id="wheel" class="wheel"></div>
      <div class="wheel-btn-bar">
        <a href="register.html" button class="wheel-btn" id="newTicketBtn">
          <img src="public/images/haveticket-white-icon.svg" alt="">
          새로운 PROOF TICKET 발급받기
        </a>
      </div>
    </section>
  </main>
  <dialog id="ticketModal" class="ticket-modal">
    <div class="modal-box">
      <button type="button" class="close" aria-label="닫기">✕</button>
      <div class="tickets">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div style="display:flex;gap:32px;justify-content:center;align-items:center;">
            <div class="ticketContainer is-front">
              <div class="lightOverlay"></div>
              <proof-ticket id="tFront" shape-src="./public/images/ticket-shape.svg" side="front" scale="0.82"></proof-ticket>
            </div>
            <div class="ticketContainer is-back">
              <div class="lightOverlay"></div>
              <proof-ticket id="tBack" shape-src="./public/images/ticket-shape.svg" side="back" scale="0.82"></proof-ticket>
            </div>
          </div>
          <button id="downloadTicketBtn" class="wheel-btn" style="background:transparent;color:#fff;border-radius:8px;width:fit-content;padding:12px 28px;font-size:1.1em;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.12);margin-top:-100px;">원본 파일 저장</button>
          
        </div>
      </div>
    </div>
  </dialog>
  <script type="module" src="./ticket.js"></script>
  <script type="module" src="./myproofticket.js"></script>
</body>
</html>
